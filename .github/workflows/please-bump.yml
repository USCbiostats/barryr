name: please-bump

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  please-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The action compares the pull request's head to its base commit.
          fetch-depth: 0
      - uses: gvegayon/please-bump@v1
